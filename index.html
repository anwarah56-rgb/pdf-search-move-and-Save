<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Search Merge Compress Save</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>body{font-family:Arial;background:#f4f6f8;padding:16px}.app{max-width:900px;margin:auto;background:white;padding:20px;border-radius:14px}h1{text-align:center;color:#1769e0}section{border:1px solid #ddd;padding:15px;margin:14px 0;border-radius:10px}input,button,select{width:100%;padding:11px;margin:6px 0;box-sizing:border-box}button{background:#1769e0;color:white;border:0;border-radius:7px;font-weight:bold}.stop{background:#c62828}.green{background:#188038}.purple{background:#6a1b9a}.orange{background:#ef6c00}.status{padding:10px;background:#eef2f5;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;font-size:13px}</style></head>
<body><div class="app"><h1>PDF Search • Merge • Compress • Save</h1>
<section><h3>1. Search PDFs from Excel</h3><b>PDF Files</b><input id="pdf" type="file" accept=".pdf" multiple><b>Excel File</b><input id="excel" type="file" accept=".xlsx,.xls">
<button id="search">START SEARCH</button><button id="stop" class="stop" disabled>STOP</button><button id="zip" class="green" disabled>DOWNLOAD SELECTED PDFs (ZIP)</button><div id="st" class="status">Ready</div>
<table><thead><tr><th>Select</th><th>Search Name</th><th>Status</th><th>PDF</th></tr></thead><tbody id="out"></tbody></table></section>
<section><h3>2. Merge PDFs</h3><input id="merge" type="file" accept=".pdf" multiple><input id="mergeName" value="Merged_PDF.pdf"><button id="mergeBtn" class="purple">MERGE PDFs & DOWNLOAD</button><div id="mst" class="status">Ready</div></section>
<section><h3>3. Compress / Optimize PDF</h3><input id="comp" type="file" accept=".pdf"><select id="level"><option>Low</option><option selected>Medium</option><option>High</option></select><button id="compBtn" class="orange">COMPRESS / OPTIMIZE & DOWNLOAD</button><div id="cst" class="status">Ready</div><p style="font-size:13px;color:#666">Browser compression mainly optimizes PDF structure. Scanned/image PDFs may need image re-encoding for major size reduction.</p></section></div>
<script>
const {PDFDocument}=PDFLib;let stopped=false,items=[];
const $=id=>document.getElementById(id),save=(b,n)=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
function refresh(){ $('zip').disabled=!items.some(x=>x.checked)}
$('stop').onclick=()=>{stopped=true;$('st').textContent='Stopping...'};
$('zip').onclick=async()=>{let s=items.filter(x=>x.checked);if(!s.length)return;let z=new JSZip();s.forEach(x=>z.file(x.file.name,x.file));save(await z.generateAsync({type:'blob'}),'Selected_PDFs.zip');$('st').textContent=s.length+' PDF(s) downloaded as ZIP';};
$('search').onclick=async()=>{items=[];$('out').innerHTML='';stopped=false;let fs=[...$('pdf').files],ef=$('excel').files[0];if(!fs.length||!ef)return alert('Select PDF files and Excel file.');$('search').disabled=true;$('stop').disabled=false;
try{let wb=XLSX.read(await ef.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),names=rows.map(r=>String(r[0]||'').trim()).filter(Boolean);if(names[0]&&/search|proposal/i.test(names[0]))names.shift();let f=0,n=0;
for(let name of names){if(stopped)break;let file=fs.find(x=>x.name.toLowerCase().includes(name.toLowerCase())),tr=document.createElement('tr');if(file){f++;let item={file,checked:false};items.push(item);let cb=document.createElement('input');cb.type='checkbox';cb.onchange=()=>{item.checked=cb.checked;refresh()};tr.innerHTML='<td></td><td>'+name+'</td><td style="color:green;font-weight:bold">FOUND</td><td>'+file.name+'</td>';tr.cells[0].appendChild(cb)}else{n++;tr.innerHTML='<td></td><td>'+name+'</td><td style="color:red;font-weight:bold">NOT FOUND</td><td></td>'}$('out').appendChild(tr);$('st').textContent=`Processed: ${f+n} | Found: ${f} | Not Found: ${n}`;await new Promise(r=>setTimeout(r,0))}$('st').textContent+=stopped?' | STOPPED':' | COMPLETE'}catch(e){alert(e.message)}$('search').disabled=false;$('stop').disabled=true;refresh()};
$('mergeBtn').onclick=async()=>{let fs=[...$('merge').files];if(fs.length<2)return alert('Select at least 2 PDFs.');let b=$('mergeBtn');b.disabled=true;try{let out=await PDFDocument.create();for(let i=0;i<fs.length;i++){$('mst').textContent=`Merging ${i+1} of ${fs.length}...`;let src=await PDFDocument.load(await fs[i].arrayBuffer(),{ignoreEncryption:true});(await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p))}let bytes=await out.save({useObjectStreams:true}),name=$('mergeName').value||'Merged_PDF.pdf';if(!/\.pdf$/i.test(name))name+='.pdf';save(new Blob([bytes],{type:'application/pdf'}),name);$('mst').textContent='Merge complete'}catch(e){$('mst').textContent='Error: '+e.message}b.disabled=false};
$('compBtn').onclick=async()=>{let f=$('comp').files[0];if(!f)return alert('Select a PDF.');let b=$('compBtn');b.disabled=true;try{let d=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true}),bytes=await d.save({useObjectStreams:true}),name=f.name.replace(/\.pdf$/i,'')+'_compressed.pdf';save(new Blob([bytes],{type:'application/pdf'}),name);$('cst').textContent=`Original ${(f.size/1048576).toFixed(2)} MB → New ${(bytes.length/1048576).toFixed(2)} MB`}catch(e){$('cst').textContent='Error: '+e.message}b.disabled=false};
</script></body></html>
