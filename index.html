<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769e0">
<title>PDF Search & Save</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:18px;color:#222}
.app{max-width:760px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 3px 16px #0002}
h1{text-align:center;color:#1769e0;margin-top:0}
label{display:block;font-weight:bold;margin:16px 0 7px}
input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:8px;border:1px solid #bbb;font-size:16px}
button{background:#1769e0;color:#fff;border:0;margin-top:10px;font-weight:bold}
.stop{background:#c62828}
.save{background:#188038}
.status{margin-top:16px;padding:12px;background:#eef2f5;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{border:1px solid #ddd;padding:8px;font-size:13px}
th{background:#eef2f5}
.ok{color:green;font-weight:bold}.bad{color:#c00;font-weight:bold}
.note{font-size:13px;color:#666;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<h1>PDF Search & Save</h1>

<label>1. Select PDF Files</label>
<input id="pdf" type="file" accept=".pdf" multiple>

<label>2. Select CSV File</label>
<input id="csv" type="file" accept=".csv">

<button id="search">START SEARCH</button>
<button id="stop" class="stop" disabled>STOP</button>

<div id="status" class="status">Ready</div>

<table>
<thead><tr><th>Search Name</th><th>Status</th><th>PDF File</th></tr></thead>
<tbody id="out"></tbody>
</table>

<div class="note">
For security, a browser cannot silently create/move files in an arbitrary folder.
This version lets you search matching PDFs and then save/download the selected PDF.
For many PDFs, select the files once and use the Save button shown for each match.
</div>
</div>

<script>
let stopped=false;
const pdf=document.getElementById('pdf'),csv=document.getElementById('csv');
const search=document.getElementById('search'),stop=document.getElementById('stop');
const status=document.getElementById('status'),out=document.getElementById('out');

stop.onclick=()=>{stopped=true;status.textContent='Stopping...';};

function esc(s){
 return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function downloadFile(file){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(file);
 a.download=file.name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

search.onclick=async()=>{
 stopped=false;out.innerHTML='';
 const files=[...pdf.files], data=csv.files[0];
 if(!files.length)return alert('Please select PDF files.');
 if(!data)return alert('Please select CSV file.');

 search.disabled=true;stop.disabled=false;
 try{
   let text=await data.text();
   let names=text.split(/\r?\n/)
     .map(x=>x.split(',')[0].replace(/^"|"$/g,'').trim())
     .filter(Boolean);
   if(names.length && /search name/i.test(names[0])) names.shift();

   let found=0,notFound=0;
   for(const name of names){
     if(stopped)break;
     const match=files.find(f=>f.name.toLowerCase().includes(name.toLowerCase()));
     const tr=document.createElement('tr');
     const n=document.createElement('td');n.textContent=name;
     const s=document.createElement('td');
     const f=document.createElement('td');

     if(match){
       found++;
       s.textContent='FOUND';s.className='ok';
       f.innerHTML=esc(match.name)+'<br><button class="save" type="button">SAVE PDF</button>';
       f.querySelector('button').onclick=()=>downloadFile(match);
     }else{
       notFound++;
       s.textContent='NOT FOUND';s.className='bad';
     }
     tr.append(n,s,f);out.append(tr);
     status.textContent=`Processed: ${found+notFound} | Found: ${found} | Not Found: ${notFound}`;
     await new Promise(r=>setTimeout(r,0));
   }
   status.textContent += stopped?' | STOPPED':' | COMPLETE';
 }catch(e){alert('Error: '+e.message)}
 finally{search.disabled=false;stop.disabled=true}
};
</script>
</body>
</html>
